<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aurum — Headless core</title>
    <style>
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background:
          radial-gradient(60% 50% at 15% 5%, rgba(243, 199, 123, 0.08), transparent 65%),
          radial-gradient(60% 50% at 90% 90%, rgba(94, 78, 140, 0.16), transparent 70%),
          #070708;
        color: #f4f2ec;
        font: 13px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .shell {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 340px;
        gap: 18px;
        height: 100dvh;
        padding: 18px;
      }
      .stage {
        position: relative;
        overflow: hidden;
        min-height: 240px;
        border: 1px solid rgba(255, 255, 255, 0.09);
        border-radius: 22px;
        background: #0b0b0e;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55);
      }
      .panel {
        display: flex;
        flex-direction: column;
        gap: 12px;
        overflow-y: auto;
        padding: 18px;
        border: 1px solid rgba(243, 199, 123, 0.18);
        border-radius: 22px;
        background: linear-gradient(180deg, #17171c, #0e0e11);
      }
      .kicker {
        color: #f3c77b;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 1.4px;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        font-size: 27px;
        font-weight: 400;
        letter-spacing: -0.3px;
      }
      p { margin: 0; color: #918d99; font-size: 12px; }
      code { color: #e8d5b0; font-size: 11px; }
      .meta {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.035);
        color: #c3bfca;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }
      .buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
      button {
        min-height: 34px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.05);
        color: #e2dfe7;
        font: inherit;
        font-size: 11.5px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { border-color: rgba(243, 199, 123, 0.4); color: #f3c77b; }
      button.primary {
        grid-column: 1 / -1;
        border: 0;
        background: linear-gradient(180deg, #f9d693, #e2ad52);
        color: #241a07;
      }
      pre {
        margin: 0;
        padding: 12px;
        overflow: auto;
        max-height: 230px;
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 12px;
        background: #0a0a0c;
        color: #a7c8a1;
        font: 10.5px/1.55 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        white-space: pre-wrap;
      }
      .result {
        display: none;
        overflow: hidden;
        border-radius: 12px;
        background: #0b0b0e;
      }
      .result.is-open { display: block; }
      .result img { display: block; width: 100%; height: auto; }
      .result a {
        display: block;
        padding: 8px;
        text-align: center;
        color: #f3c77b;
        font-size: 11px;
        text-decoration: none;
      }
      .status { min-height: 17px; color: #f3c77b; font-size: 11px; }
      .drop {
        border: 1px dashed rgba(243, 199, 123, 0.32);
        border-radius: 10px;
        padding: 8px;
        text-align: center;
        color: #77737f;
        font-size: 10.5px;
      }
      @media (max-width: 760px) {
        .shell {
          display: flex;
          flex-direction: column;
          height: auto;
          min-height: 100dvh;
          padding: 10px;
          gap: 10px;
        }
        .stage { flex: 0 0 auto; height: min(52dvh, 420px); min-height: 220px; }
        .panel { flex: 1 0 auto; overflow: visible; }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="stage" id="stage" aria-label="Aurum headless preview"></section>
      <aside class="panel">
        <span class="kicker">Headless core</span>
        <h1>No UI included.</h1>
        <p>
          This page imports <code>aurum.esm.js</code> and calls
          <code>createCore()</code> only. The crop frame, dock and buttons below are
          ordinary page markup wired to the public API.
        </p>
        <div class="meta">
          <span id="source">loading…</span>
          <span id="output">—</span>
        </div>
        <div class="buttons">
          <button type="button" data-act="square">Crop 1:1</button>
          <button type="button" data-act="wide">Crop 16:9</button>
          <button type="button" data-act="rotate">Rotate 90°</button>
          <button type="button" data-act="flip">Flip H</button>
          <button type="button" data-act="vivid">Vivid</button>
          <button type="button" data-act="reset">Reset</button>
          <button type="button" class="primary" data-act="export">Export PNG</button>
        </div>
        <div class="status" id="status" role="status"></div>
        <div class="result" id="result">
          <img id="result-img" alt="Exported result" />
          <a id="result-link" download>Download PNG</a>
        </div>
        <pre id="state" aria-label="Editor state JSON"></pre>
        <div class="drop" id="drop">Drop an image here · JPEG / PNG / WebP</div>
      </aside>
    </main>
    <script type="module" src="./headless.js"></script>
  </body>
</html>
