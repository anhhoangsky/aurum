<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#08080a">
<meta name="color-scheme" content="dark">
<title>Ghép ảnh — aurum</title>
<link rel="stylesheet" href="./assets/aurum.css?v=1">
<style>
  html, body { height: 100%; margin: 0; background: #08080a; overflow: hidden; }
  body { height: 100dvh; color: #f4f2ec; font: 13px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { width: 100%; height: 100%; }
  #fx { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 90;
    transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 8px 14px; border-radius: 999px;
    background: rgba(20,20,25,.96); border: 1px solid rgba(243,199,123,.3); font-size: 12px;
    box-shadow: 0 12px 32px rgba(0,0,0,.5); opacity: 0; transition: opacity .2s ease; pointer-events: none; }
  #fx.on { opacity: 1; }
  .boot { position: fixed; inset: 0; display: grid; place-items: center; color: #8f8c98; font-size: 13px; }
</style>
</head>
<body>
<div id="app"><div class="boot">Đang tải…</div></div>
<div id="fx" role="status" aria-live="polite"></div>
<script type="module">
const { createCollageEditor } = await import('./assets/aurum.esm.js?v=' + Date.now());
const host = document.getElementById('app');
host.textContent = '';
const fx = document.getElementById('fx');
let fxTimer = 0;
function flash(text) {
  fx.textContent = text;
  fx.classList.add('on');
  clearTimeout(fxTimer);
  fxTimer = setTimeout(() => fx.classList.remove('on'), 2400);
}

const photos = [
  './demo/sample-portrait.jpg',
  './demo/photo-river.jpg',
  './demo/photo-pug.jpg',
  './demo/sample-landscape.jpg',
];

const collage = createCollageEditor(host, {
  sources: photos,
  exportSize: 2048,
  onStateChange(state) {
    // The host would persist this: layout plus one crop per cell.
    console.debug('collage state', JSON.stringify(state));
  },
  onSave(blob) {
    const url = URL.createObjectURL(blob);
    const extension = blob.type === 'image/jpeg'
      ? 'jpg'
      : blob.type === 'image/webp'
        ? 'webp'
        : 'png';
    const a = document.createElement('a');
    a.href = url;
    a.download = `aurum-collage.${extension}`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    flash(`Đã xuất ${extension.toUpperCase()} · ${(blob.size / 1024).toFixed(0)} KB`);
  },
});

window.aurumCollage = collage;

// Debug handle: ?state=<json> loads a document, ?export=1 returns a data URL.
const params = new URLSearchParams(location.search);
const rawState = params.get('state');
if (rawState) {
  try {
    collage.setState(JSON.parse(decodeURIComponent(rawState)));
    flash('Đã nạp bố cục từ URL.');
  } catch {
    flash('Bố cục trong URL không hợp lệ.');
  }
}
if (params.get('export') === '1') {
  await collage.ready;
  const blob = await collage.exportBlob();
  if (blob) {
    const reader = new FileReader();
    reader.onload = () => {
      window.aurumExport = reader.result;
      flash('Sẵn sàng: window.aurumExport');
    };
    reader.readAsDataURL(blob);
  }
}
</script>
</body>
</html>
